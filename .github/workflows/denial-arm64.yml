# Build Denial from source on ARM64 and verify the patch set applies cleanly.
#
# Upstream's tools/denial-pc build system targets x86-64. This workflow runs it
# on an ARM64 runner with the patches from patches/ applied, then packages the
# result for each distribution that has an upstream packaging adapter.

name: Build Denial (ARM64)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub release with the packages'
        type: boolean
        default: false

  # A cold Flutter engine build costs over 40 minutes on the runner, so a push
  # to main should not start one on its own. Run this workflow by hand.
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'patches/**'

# This repository tracks one Denial tag at a time. It is a repository variable
# rather than a top-level env entry because these values are needed inside step
# `with:` blocks -- ref and cache keys -- and the env context is not available
# there.
#
#   gh variable set DENIAL_REF --body v0.6.0

jobs:
  build:
    name: "Build (${{ vars.DENIAL_REF }}, ARM64)"
    runs-on: ubuntu-24.04-arm

    env:
      DENIAL_PC_DEPENDENCY_ROOT: ${{ github.workspace }}/.denial-cache/deps
      DENIAL_PC_BUILD_ROOT: ${{ github.workspace }}/.denial-cache/pc-build
      DENIAL_FLUTTER_ENGINE_CACHE_ROOT: ${{ github.workspace }}/.denial-cache/engine
      DENIAL_FLUTTER_ENGINE_JOBS: 2

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Checkout Denial (${{ vars.DENIAL_REF }})"
        uses: actions/checkout@v7
        with:
          repository: denialwm/denial
          ref: ${{ vars.DENIAL_REF }}
          path: denial
          fetch-depth: 0
          fetch-tags: true

      - name: "Restore Denial engine cache"
        id: engine-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/.denial-cache/engine/artifacts
            ${{ github.workspace }}/.denial-cache/engine/state
          key: denial-engine-cache-${{ vars.DENIAL_REF }}
          restore-keys: |
            denial-engine-cache-${{ vars.DENIAL_REF }}

      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl tar xz-utils zip unzip \
            build-essential cmake ninja-build pkg-config \
            clang llvm libclang-dev \
            rustup \
            libglvnd-dev libegl1-mesa-dev mesa-common-dev \
            libdrm-dev libgbm-dev libgles-dev libsdl2-dev \
            libinput-dev libudev-dev libxkbcommon-dev libseat-dev \
            libglib2.0-dev libgtk-3-dev fontconfig \
            libpolkit-agent-1-dev \
            rpm rpm2cpio libarchive-tools \
            jq bubblewrap \
            makepkg fakeroot \
            sccache

      # Build Denial is 57 minutes of cargo compiling a few hundred crates.
      # Two things keep a repeat run from paying that again:
      #
      #  - sccache, which keys each crate on its source and flags and stores
      #    through SCCACHE_GHA_ENABLED rather than a directory restored here.
      #  - the cargo target directory itself, which lets cargo skip even the
      #    work of deciding what is stale.
      #
      # ccache is deliberately not wired to anything. The engine cache holds a
      # finished libflutter_engine.so, so on a hit Skia is never compiled and
      # there is nothing for a C++ cache to hold; on a miss Skia's objects run
      # to tens of gigabytes, past the repository quota.
      - name: "Set up sccache"
        run: |
          mkdir -p "$HOME/.cache/sccache"
          sccache --start-server
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=4G" >> "$GITHUB_ENV"
          # Let sccache store through actions/cache rather than a directory
          # this workflow would have to restore and save by hand.
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      # sccache keeps its own store through SCCACHE_GHA_ENABLED, so there is
      # no directory to restore here.

      - name: "Add Rust toolchain"
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: "Apply ARM64 patches"
        run: |
          cd denial
          git apply "$GITHUB_WORKSPACE/patches/denial-arm64.diff"
          python3 "$GITHUB_WORKSPACE/patches/patch-deps.py" seed-prebuilt .

      - name: "Denial doctor (host prerequisite check)"
        run: ./tools/denial-pc doctor || true
        working-directory: denial

      - name: "Bootstrap Denial tooling"
        run: ./tools/denial-pc bootstrap
        working-directory: denial

      - name: "Build Flutter engine (cacheable)"
        run: ./tools/denial-flutter-engine build
        working-directory: denial

      # Persist the engine right after it is built. A failure anywhere below
      # this point must not throw away the 40-plus minutes it cost.
      - name: "Save Denial engine cache"
        if: ${{ success() && steps.engine-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/.denial-cache/engine/artifacts
            ${{ github.workspace }}/.denial-cache/engine/state
          key: ${{ steps.engine-cache-restore.outputs.cache-primary-key }}

      # The Flutter engine's Skia objects are not cached: they run to tens of
      # gigabytes, past the 10 GB repository quota. What the engine cache does
      # hold is the finished libflutter_engine.so. Restoring a cargo target
      # directory on top of that changed nothing measurable, so sccache carries
      # the Rust side and there is no second cache.
      - name: "Build Denial"
        run: ./tools/denial-pc build
        working-directory: denial

      - name: "Report compiler cache"
        if: ${{ always() }}
        run: |
          sccache --show-stats || true

      - name: "Stage runtime"
        run: ./tools/stage-denial-runtime
        working-directory: denial

      # Package and upload one distribution at a time. Each upload runs with
      # always() so a later target failing cannot discard what already built,
      # and each upload only reports missing files as a warning -- a target
      # that failed for its own reason should not double up as an upload error.
      #
      # Arch and Alpine share one container. Each needs a userland of its own:
      # on the runner makepkg aborted before printing anything, and the Alpine
      # sandbox's bwrap --unshare-user was refused by the service. An Arch
      # Linux container gives both a native /etc, a real pacman database and
      # user namespaces that work. podman is already on the ubuntu-24.04-arm
      # image, so this costs no install step.
      - name: "Package (Arch and Alpine in a container)"
        id: package-arch-alpine
        run: |
          set -o pipefail
          podman run --rm \
            --volume "$GITHUB_WORKSPACE/denial":/denial \
            --volume "$GITHUB_WORKSPACE/.denial-cache":/cache \
            --workdir /denial \
            --env DENIAL_PC_BUILD_ROOT=/cache/pc-build \
            --env DENIAL_PC_PACKAGE_ROOT=/cache/pc-build/packages \
            --env DENIAL_PC_MAKEPKG_ROOT=/cache/pc-build/makepkg \
            --env DENIAL_PC_ALPINE_ROOT=/cache/pc-build/alpine-package \
            --env DENIAL_PC_DEPENDENCY_ROOT=/cache/deps \
            docker.io/library/archlinux:latest \
            /bin/bash -o pipefail -c '
              set -euo pipefail
              pacman -Sy --needed --noconfirm \
                base-devel git python python-pybind11 go rust \
                bash coreutils findutils gawk grep sed tar gzip \
                fakeroot patchelf abuild
              # makepkg refuses to run as root, and apabuild wants one
              # unprivileged account too. chown the mounted trees so it can
              # write its own caches and the package outputs.
              useradd --create-home --shell /bin/bash builder
              chown -R builder:builder /cache /denial

              echo "=== arch-package ==="
              arch_status=0
              su builder -c "./tools/denial-pc arch-package" || arch_status=$?
              echo "=== arch-package exited $arch_status ==="

              echo "=== alpine-package ==="
              # apabuild stages packages in a root-only chroot, so this half
              # runs as root and gives the tree back afterwards.
              alpine_status=0
              ./tools/denial-pc alpine-package || alpine_status=$?
              chown -R builder:builder /cache /denial
              echo "=== alpine-package exited $alpine_status ==="

              # Report both, and fail the step if either failed, so one
              # broken target does not hide the other.
              test "$arch_status" -eq 0 && test "$alpine_status" -eq 0
            '
        # Allowed to fail so an unproven packaging path cannot block the RPM
        # and deb targets.
        continue-on-error: true

      - name: "Upload Denial Arch package"
        if: ${{ always() && steps.package-arch-alpine.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-arch-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/*.pkg.tar.zst
          retention-days: 7
          if-no-files-found: warn

      - name: "Package (Fedora RPM)"
        id: package-fedora
        run: ./tools/denial-pc fedora-package
        working-directory: denial

      - name: "Upload Denial RPM (Fedora)"
        if: ${{ always() && steps.package-fedora.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-rpm-fedora-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-[0-9]*.rpm
          retention-days: 7
          if-no-files-found: error

      - name: "Upload Denial Flutter Engine RPM (Fedora)"
        if: ${{ always() && steps.package-fedora.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-flutter-engine-rpm-fedora-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-flutter-engine-*.rpm
          retention-days: 7
          if-no-files-found: error

      - name: "Package (openSUSE RPM)"
        id: package-opensuse
        run: ./tools/denial-pc opensuse-package
        working-directory: denial

      - name: "Upload Denial RPM (openSUSE)"
        if: ${{ always() && steps.package-opensuse.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-rpm-opensuse-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/opensuse/denial-[0-9]*.rpm
          retention-days: 7
          if-no-files-found: error

      - name: "Upload Denial Flutter Engine RPM (openSUSE)"
        if: ${{ always() && steps.package-opensuse.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-flutter-engine-rpm-opensuse-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/opensuse/denial-flutter-engine-*.rpm
          retention-days: 7
          if-no-files-found: error

      - name: "Package (Debian/Ubuntu deb)"
        id: package-deb
        run: ./tools/denial-pc debian-package
        working-directory: denial

      - name: "Upload Denial deb"
        if: ${{ always() && steps.package-deb.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-deb-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/*.deb
          retention-days: 7
          if-no-files-found: error

      - name: "Upload Denial APK"
        if: ${{ always() && steps.package-arch-alpine.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-apk-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/*.apk
          retention-days: 7
          if-no-files-found: warn

  release:
    name: "Publish release"
    needs: build
    runs-on: ubuntu-24.04-arm
    if: ${{ inputs.publish_release }}

    permissions:
      contents: write

    steps:
      - name: "Download all packages"
        uses: actions/download-artifact@v8
        with:
          pattern: denial-*-arm64
          path: packages
          merge-multiple: true

      - name: "List packages"
        run: find packages -type f | sort

      - name: "Publish GitHub release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ vars.DENIAL_REF }}
          prerelease: true
          files: packages/*