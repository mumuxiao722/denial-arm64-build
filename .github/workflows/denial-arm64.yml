# Build Denial from source on ARM64 and verify the patch set applies cleanly.
#
# Upstream's tools/denial-pc build system targets x86-64. This workflow runs it
# on an ARM64 runner with the patches from patches/ applied, then packages the
# result for each distribution that has an upstream packaging adapter.

name: Build Denial (ARM64)

on:
  workflow_dispatch:
    inputs:
      denial_ref:
        description: 'Denial release to build'
        type: string
        required: true
      publish_release:
        description: 'Publish a GitHub release with the packages'
        type: boolean
        default: false

  # A cold Flutter engine build costs over 40 minutes on the runner, so a push
  # to main should not start one on its own. Run this workflow by hand.
  # push:
  #   branches: [ main ]
  #   paths:
  #     - 'patches/**'

# This repository tracks one Denial tag at a time, and the run names it. It used
# to be a repository variable, which meant an upgrade could only be tested by
# changing shared state that main also read, so a branch under test left main
# unable to build. Making it an input gives each run its own answer.
#
#   gh workflow run denial-arm64.yml -f denial_ref=v0.5.0
#
# The value is written where env is not available: the ref and cache key live
# inside step `with:` blocks.

jobs:
  build:
    name: "Build (${{ inputs.denial_ref }}, ARM64)"
    runs-on: ubuntu-24.04-arm

    outputs:
      # Whether all ten uploads succeeded. Each Package step runs on always()
      # so one broken target does not cancel the other four, which means the
      # job itself can be green while a distribution produced nothing. The
      # release reads this rather than needs.build.result.
      uploads-complete: ${{ steps.upload-gate.outputs.complete }}
      upload-report: ${{ steps.upload-gate.outputs.report }}

    env:
      DENIAL_PC_DEPENDENCY_ROOT: ${{ github.workspace }}/.denial-cache/deps
      DENIAL_PC_BUILD_ROOT: ${{ github.workspace }}/.denial-cache/pc-build
      DENIAL_FLUTTER_ENGINE_CACHE_ROOT: ${{ github.workspace }}/.denial-cache/engine
      DENIAL_FLUTTER_ENGINE_JOBS: 2

    steps:
      - name: "Checkout Repo"
        uses: actions/checkout@v7

      - name: "Checkout Denial (${{ inputs.denial_ref }})"
        uses: actions/checkout@v7
        with:
          repository: denialwm/denial
          ref: ${{ inputs.denial_ref }}
          path: denial
          fetch-depth: 0
          fetch-tags: true

      - name: "Restore Denial engine cache"
        id: engine-cache-restore
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ github.workspace }}/.denial-cache/engine/artifacts
            ${{ github.workspace }}/.denial-cache/engine/state
          key: denial-engine-cache-${{ inputs.denial_ref }}
          restore-keys: |
            denial-engine-cache-${{ inputs.denial_ref }}

      # The build toolchain. bsdtar is here rather than in the Arch step
      # because package-denial-rpm, package-denial-apk and package-denial-arch
      # all require it, and it only worked in one step while Arch happened to
      # run first. The tools a single target needs stay with that target.
      #
      # The APK target is not packaged on Alpine: its APKBUILD declares
      # gcompat as a runtime dependency, so it is built for other systems from
      # this ordinary glibc host.
      - name: "Install Build Tools"
        run: |
          sudo apt-get update
          # libarchive-tools is here rather than beside any one target because
          # package-denial-rpm, package-denial-apk and package-denial-arch each
          # declare bsdtar in their required_command list, and whichever of
          # those ran before the step that installed it failed with
          # "bsdtar is required". It is not tar: an APK is several gzip streams
          # concatenated, and GNU tar stops after the first one, so it cannot
          # see the .PKGINFO or the signature that follows.
          #
          # Comments belong above the command, never inside the continuation
          # list below. A YAML block scalar keeps "# ..." as shell text, where
          # it starts a comment, so the backslash then joins the comment
          # instead of the package name and the last package is run as a
          # command of its own.
          sudo apt-get install -y --no-install-recommends \
            git curl tar xz-utils zip unzip \
            build-essential cmake ninja-build pkg-config \
            clang llvm libclang-dev \
            rustup \
            libglvnd-dev libegl1-mesa-dev mesa-common-dev \
            libdrm-dev libgbm-dev libgles-dev libsdl2-dev \
            libinput-dev libudev-dev libxkbcommon-dev libseat-dev \
            libglib2.0-dev libgtk-3-dev fontconfig \
            libpolkit-agent-1-dev \
            jq \
            libarchive-tools

      - name: "Add Rust toolchain"
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: "Apply ARM64 patches"
        run: |
          cd denial
          git apply "$GITHUB_WORKSPACE/patches/denial-arm64.diff"
          python3 "$GITHUB_WORKSPACE/patches/arm64-prep.py" prep-checkout .

      - name: "Denial doctor (host prerequisite check)"
        run: ./tools/denial-pc doctor || true
        working-directory: denial

      - name: "Bootstrap Denial tooling"
        run: ./tools/denial-pc bootstrap
        working-directory: denial

      - name: "Build Flutter engine (cacheable)"
        run: ./tools/denial-flutter-engine build
        working-directory: denial

      # Persist the engine right after it is built. A failure anywhere below
      # this point must not throw away the 40-plus minutes it cost.
      - name: "Save Denial engine cache"
        if: ${{ success() && steps.engine-cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ github.workspace }}/.denial-cache/engine/artifacts
            ${{ github.workspace }}/.denial-cache/engine/state
          key: ${{ steps.engine-cache-restore.outputs.cache-primary-key }}

      # The Flutter engine's Skia objects are not cached: they run to tens of
      # gigabytes, past the 10 GB repository quota. What the engine cache does
      # hold is the finished libflutter_engine.so. Neither a compiler cache nor
      # a restored cargo target directory measurably shortened the Rust side,
      # so the engine cache is the only one.
      - name: "Build Denial"
        run: ./tools/denial-pc build
        working-directory: denial

      # Stage runtime builds the payload once. Every package script would
      # otherwise call stage-denial-runtime itself, so a full run staged it six
      # times: once here and once inside each of the five Package steps.
      # It is idempotent, but each repeat costs the copy. The five steps set
      # DENIAL_PACKAGE_SKIP_STAGE=1, which is the switch those scripts provide
      # for exactly this; package-denial-arch:47 says so in its own comment:
      # build and stage once, every format consumes the same bytes.
      - name: "Stage runtime"
        id: stage-runtime
        run: ./tools/stage-denial-runtime
        working-directory: denial

      # Package and upload one distribution at a time. Each upload runs with
      # always() so a later target failing cannot discard what already built,
      # and each upload only reports missing files as a warning -- a target
      # that failed for its own reason should not double up as an upload error.
      #
      # Alpine packages on the runner. Run d2b7abe did this without abuild on
      # the host and the step passed, so denial-pc alpine-package brings what
      # it needs with it.

      - name: "Package (Debian/Ubuntu deb)"
        env:
          DENIAL_PACKAGE_SKIP_STAGE: 1
        id: package-deb
        if: ${{ always() && steps.stage-runtime.conclusion == 'success' }}
        run: ./tools/denial-pc debian-package
        working-directory: denial


      - name: "Upload Denial deb"
        id: upload-deb
        if: ${{ always() && steps.package-deb.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-deb-arm64
          # The compositor and its engine travel together; the plugin manager
          # is a separate optional component. "[0-9]" is what separates the
          # compositor from the two denial-<word> packages, since every name
          # starts with denial- and a plain denial-* would match all three.
          path: |
            ${{ github.workspace }}/.denial-cache/pc-build/packages/denial_[0-9]*.deb
            ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-flutter-engine_*.deb
          retention-days: 7
          if-no-files-found: error

      - name: "Upload Denial Plugin Manager deb"
        id: upload-deb-plugin
        if: ${{ always() && steps.package-deb.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-deb-plugin-manager-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-plugin-manager_*.deb
          retention-days: 7
          if-no-files-found: error

      # Arch packages on the runner. package-denial-arch needs bsdtar, find,
      # makepkg, mktemp and rm. Ubuntu noble packages makepkg and libalpm for
      # arm64 separately; arch-install-scripts is only the bootstrap scripts
      # and carries no makepkg at all.
      #
      # A container was the other option and cannot work: Arch publishes no
      # ARM64 image, and its four repositories come from one pipeline over one
      # set of rootfs archives, so there is no registry to switch to.

      # Arch packages on the runner. package-denial-arch needs bsdtar, find,
      # makepkg, mktemp and rm. Ubuntu noble packages makepkg and libalpm for
      # arm64 separately; arch-install-scripts is only the bootstrap scripts
      # and carries no makepkg at all.
      #
      # A container was the other option and cannot work: Arch publishes no
      # ARM64 image, and its four repositories come from one pipeline over one
      # set of rootfs archives, so there is no registry to switch to.
      - name: "Package (Arch)"
        id: package-arch
        run: |
          # makepkg and pacman-package-manager are two debs from one source
          # package, and makepkg alone is not enough: makepkg.sh resolves
          # pacman by name at startup and kills itself with SIGUSR1 when that
          # lookup fails, which surfaces as exit 138. --no-install-recommends
          # suppresses pacman-package-manager's Recommends on makepkg, so both
          # are named explicitly. The deb named pacman is the arcade game and
          # installs under /usr/games, off PATH.
          sudo apt-get install -y --no-install-recommends \
            makepkg pacman-package-manager gawk
          # pacman-package-manager creates /var/lib/pacman but not its local
          # database, and libalpm refuses to initialize without a valid one. It
          # does not stop the build, but it prints failed to initialize alpm
          # library on every makepkg invocation. mkdir alone is not enough:
          # an empty directory is reported as database is incorrect version,
          # so the database is created and then upgraded into shape.
          sudo mkdir -p /var/lib/pacman/local
          sudo pacman-db-upgrade
          # || exit $? so a failure inside is this step's failure. denial-pc
          # runs the packaging in a child process, so the shell would otherwise
          # go on to the next command and report success whatever it returned.
          ./tools/denial-pc arch-package 2>&1 || exit $?
          # actions/upload-artifact rejects ":<>|*\r\n" in an artifact path,
          # because someone downloading it may be on NTFS, which cannot
          # represent them. The runner here is ext4 and has no such problem,
          # but the upload does. makepkg names a package with an epoch as
          # name-epoch:pkgver-..., so only the engine package carries a colon.
          # Rename rather than drop the epoch: pacman reads the version and
          # architecture from .PKGINFO inside the package, not from the file
          # name, and the epoch has to stay in that metadata for its
          # downgrade protection. The separator is only a separator.
          for p in "${{ github.workspace }}"/.denial-cache/pc-build/packages/*.pkg.tar.gz; do
            [ -e "$p" ] || continue
            case "$p" in *:*) mv -- "$p" "${p//:/+}" ;; esac
          done
        working-directory: denial
        env:
          DENIAL_PACKAGE_SKIP_STAGE: 1
          DENIAL_PC_MAKEPKG_ROOT: ${{ github.workspace }}/.denial-cache/pc-build/makepkg


      - name: "Upload Denial Arch package"
        id: upload-arch
        if: ${{ always() && steps.package-arch.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-arch-arm64
          # Ubuntu's makepkg ships /etc/makepkg.conf with PKGEXT=.pkg.tar.gz.
          # Arch uses .zst, which this runner does not guarantee.
          #
          # denial-* would also match denial-flutter-engine-* and
          # denial-plugin-manager-*, so the two wanted packages are named
          # outright rather than left to a pattern.
          path: |
            ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-[0-9]*.pkg.tar.gz
            ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-flutter-engine-*.pkg.tar.gz
          retention-days: 7
          if-no-files-found: error


      - name: "Upload Denial Arch plugin manager"
        id: upload-arch-plugin
        if: ${{ always() && steps.package-arch.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-arch-plugin-manager-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-plugin-manager-*.pkg.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: "Package (Fedora RPM)"
        env:
          DENIAL_PACKAGE_SKIP_STAGE: 1
        id: package-fedora
        if: ${{ always() && steps.stage-runtime.conclusion == 'success' }}
        run: |
          # rpm and rpmbuild are wanted by both RPM targets and by neither of
          # the other three. openSUSE runs next and inherits this install
          # rather than repeating it.
          sudo apt-get install -y --no-install-recommends rpm
          ./tools/denial-pc fedora-package
        working-directory: denial


      - name: "Upload Denial RPM (Fedora)"
        id: upload-fedora
        if: ${{ always() && steps.package-fedora.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-rpm-fedora-arm64
          # The compositor and its engine travel together; the plugin
          # manager is a separate optional component. "[0-9]" is what
          # separates the compositor from the two denial-<word> packages,
          # since every name starts with denial- and a plain denial-* would
          # match all three.
          path: |
            ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-[0-9]*.rpm
            ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-flutter-engine-*.rpm
          retention-days: 7
          if-no-files-found: error

      - name: "Upload Denial Plugin Manager RPM (Fedora)"
        id: upload-fedora-plugin
        if: ${{ always() && steps.package-fedora.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-rpm-plugin-manager-fedora-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-plugin-manager-*.rpm
          retention-days: 7
          if-no-files-found: error

      - name: "Package (openSUSE RPM)"
        env:
          DENIAL_PACKAGE_SKIP_STAGE: 1
        id: package-opensuse
        if: ${{ always() && steps.stage-runtime.conclusion == 'success' }}
        run: ./tools/denial-pc opensuse-package
        working-directory: denial


      - name: "Upload Denial RPM (openSUSE)"
        id: upload-opensuse
        if: ${{ always() && steps.package-opensuse.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-rpm-opensuse-arm64
          # The compositor and its engine travel together; the plugin
          # manager is a separate optional component. "[0-9]" is what
          # separates the compositor from the two denial-<word> packages,
          # since every name starts with denial- and a plain denial-* would
          # match all three.
          path: |
            ${{ github.workspace }}/.denial-cache/pc-build/packages/opensuse/denial-[0-9]*.rpm
            ${{ github.workspace }}/.denial-cache/pc-build/packages/opensuse/denial-flutter-engine-*.rpm
          retention-days: 7
          if-no-files-found: error

      - name: "Upload Denial Plugin Manager RPM (openSUSE)"
        id: upload-opensuse-plugin
        if: ${{ always() && steps.package-opensuse.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-rpm-plugin-manager-opensuse-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/opensuse/denial-plugin-manager-*.rpm
          retention-days: 7
          if-no-files-found: error

      # Package and upload one distribution at a time. Each upload runs with
      # always() so a later target failing cannot discard what already built,
      # and each upload only reports missing files as a warning -- a target
      # that failed for its own reason should not double up as an upload error.
      #
      # Alpine packages on the runner. Run d2b7abe did this without abuild on
      # the host and the step passed, so denial-pc alpine-package brings what
      # it needs with it.
      - name: "Package (Alpine APK)"
        env:
          DENIAL_PACKAGE_SKIP_STAGE: 1
        id: package-alpine
        # Each target is independent, so one failure must not skip the
        # others. But they all consume what Stage runtime staged, so
        # running them without a payload only manufactures false failures.
        if: ${{ always() && steps.stage-runtime.conclusion == 'success' }}
        run: |
          # package-denial-apk runs bwrap --unshare-user twice, which has to
          # write /proc/self/uid_map. Ubuntu 24.04 defaults
          # kernel.apparmor_restrict_unprivileged_userns to 1, and AppArmor
          # denies exactly that write, so bwrap exits with "setting up uid
          # map: Permission denied". That is a policy bit, not a missing
          # kernel feature, so turning it off is enough. See Ubuntu bug
          # 2162114.
          #
          # No separate bwrap probe here: run_alpine() already runs bwrap with
          # --bind and --dev, so it exercises the same path. A probe without a
          # bind builds an empty root and then fails on execvp, which says
          # nothing about the packaging.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # bwrap is the one tool only this target needs, so it is installed
          # here rather than in the shared build step.
          sudo apt-get install -y --no-install-recommends bubblewrap
          ./tools/denial-pc alpine-package
        working-directory: denial
        # Allowed to fail so an unproven packaging path cannot block the RPM
        # and deb targets.


      - name: "Upload Denial APK"
        id: upload-alpine
        if: ${{ always() && steps.package-alpine.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-apk-arm64
          # The compositor and its engine travel together; the plugin manager
          # is a separate optional component. "[0-9]" is what separates the
          # compositor from the two denial-<word> packages, since every name
          # starts with denial- and a plain denial-*.apk would match all three.
          path: |
            ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-[0-9]*.apk
            ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-flutter-engine-*.apk
          retention-days: 7
          if-no-files-found: error

      - name: "Upload Denial Plugin Manager APK"
        id: upload-alpine-plugin
        if: ${{ always() && steps.package-alpine.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: denial-apk-plugin-manager-arm64
          path: ${{ github.workspace }}/.denial-cache/pc-build/packages/denial-plugin-manager-*.apk
          retention-days: 7
          if-no-files-found: error


      # Each Package step runs on always(), so a failed target leaves its
      # upload skipped and the job still green. Collect that here rather than
      # upload skipped and the job still green. Collect that here rather than
      # letting the release publish whatever happened to arrive.
      - name: "Collect upload status"
        id: upload-gate
        if: ${{ always() }}
        env:
          UPLOADS: |
            upload-deb ${{ steps.upload-deb.outcome }}
            upload-deb-plugin ${{ steps.upload-deb-plugin.outcome }}
            upload-arch ${{ steps.upload-arch.outcome }}
            upload-arch-plugin ${{ steps.upload-arch-plugin.outcome }}
            upload-fedora ${{ steps.upload-fedora.outcome }}
            upload-fedora-plugin ${{ steps.upload-fedora-plugin.outcome }}
            upload-opensuse ${{ steps.upload-opensuse.outcome }}
            upload-opensuse-plugin ${{ steps.upload-opensuse-plugin.outcome }}
            upload-alpine ${{ steps.upload-alpine.outcome }}
            upload-alpine-plugin ${{ steps.upload-alpine-plugin.outcome }}
        run: |
          failed=()
          while read -r id outcome; do
            [[ "$outcome" == success ]] || failed+=("$id=$outcome")
          done <<< "$UPLOADS"
          if (( ${#failed[@]} )); then
            report=$(IFS=, ; echo "${failed[*]}")
            echo "::warning::these uploads did not succeed: ${report//,/, }"
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "report=$report" >> "$GITHUB_OUTPUT"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "report=all uploads succeeded" >> "$GITHUB_OUTPUT"
          fi


  release:
    name: "Publish release"
    needs: build
    runs-on: ubuntu-24.04-arm
    if: ${{ inputs.publish_release }}

    permissions:
      contents: write

    steps:
      # A release with a hole in it is worse than no release. Each Package
      # step runs on always() so one broken target does not cancel the other
      # four, which also means needs.build.result is success while a
      # distribution produced nothing and its upload was skipped. This refuses
      # to publish in that case and names what is missing.
      - name: "Require every upload to have succeeded"
        env:
          COMPLETE: ${{ needs.build.outputs.uploads-complete }}
          REPORT: ${{ needs.build.outputs.upload-report }}
        run: |
          if [[ "$COMPLETE" != true ]]; then
            echo "::error::Not publishing a release: not every upload succeeded."
            echo "::error::Failed or skipped: $REPORT"
            exit 1
          fi
          echo "All uploads succeeded: $REPORT"

      - name: "Download all packages"
        uses: actions/download-artifact@v8
        with:
          pattern: denial-*-arm64
          path: packages
          merge-multiple: true

      - name: "List packages"
        run: find packages -type f | sort

      - name: "Publish GitHub release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.denial_ref }}
          # Upstream Denial ships its own tags as prereleases. These are the
          # ARM64 packages for the same upstream releases, built from a pinned
          # revision and verified by Nix Install Check, so they are published as
          # ordinary releases rather than carrying that label forward.
          prerelease: false
          files: packages/*