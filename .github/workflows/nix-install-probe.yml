name: Nix Install Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-install-probe-${{ github.ref }}
  cancel-in-progress: false

# Not a check of this repository. It builds a NixOS system with nothing in
# it and asks nixos-install to install it, so that the mechanics can be
# verified in minutes instead of after the hour that compiling the Flutter
# engine takes. Nothing here mentions Denial, and nothing here can fail
# because of a change to this repository's packaging.
#
# Three runs of Nix Install Check failed in a row, each for a different
# reason and each after paying for the whole closure first:
#
#   --no-channel / --no-boot-loader   are not options
#   nixos-enter and nix-env           were not on PATH
#   prepending the profile directory  shadowed the system's sudo
#
# The first two were spelling and PATH. The third was a chroot, and that one
# is what this exists to answer, because it is the part that cannot be
# checked without running it.
#
# It runs on the same runner as the real check, and asserts the same things
# that survive an install: the profile, the profile link, and the system
# closure being present in the target. If those appear, the mechanism works
# and Nix Install Check is only failing for reasons of its own.

jobs:
  probe:
    name: Install a bare NixOS system with nixos-install
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        name: Check out this repository

      - uses: cachix/install-nix-action@v31
        name: Install Nix

      # No programs.denial, no overlay, no source engine. Everything here
      # comes from cache.nixos.org.
      - name: Build a bare system
        run: |
          mkdir -p bare
          cat > bare/flake.nix <<'EOF'
          {
            description = "A NixOS system with nothing in it";

            inputs.nixpkgs.url = "github:NixOS/nixpkgs/nixos-26.05";

            outputs =
              { self, nixpkgs }:
              {
                nixosConfigurations.bare = nixpkgs.lib.nixosSystem {
                  system = "aarch64-linux";
                  modules = [
                    {
                      boot.loader.grub.enable = false;
                      fileSystems."/" = {
                        device = "none";
                        fsType = "tmpfs";
                      };
                      system.stateVersion = "26.05";
                    }
                  ];
                };
                packages.aarch64-linux.bare =
                  self.nixosConfigurations.bare.config.system.build.toplevel;
              };
          }
          EOF
          nix build "path:./bare#bare" -o result --show-trace --print-build-logs

      - name: Install into a target directory
        run: |
          set -euo pipefail
          target=/mnt/nixos
          sudo mkdir -p "$target"
          sudo mount -t tmpfs -o size=8G tmpfs "$target"

          # nixos-install calls nixos-enter, which is only in the system profile, and
          # runs nix-env, which the runner has on PATH through its Nix profile.
          # Neither survives the sudo below: sudoers sets secure_path to six
          # system directories, so everything exported here would be discarded.
          # Passing PATH through env is what delivers it.
          sudo env PATH="$PATH:$PWD/result/sw/bin" \
            result/sw/bin/nixos-install \
            --root "$target" \
            --system "$(readlink -f result)" \
            --no-root-passwd --no-channel-copy --no-bootloader

      - name: Check what the install left
        run: |
          set -euo pipefail
          fail=0
          target=/mnt/nixos

          check() {
            if [ -e "$target/$2" ]; then
              echo "  ok  $2"
            else
              echo "::error::$2 is missing from the installed system"
              fail=1
            fi
          }

          # What survives nixos-install exiting. Everything under /run is
          # reported rather than asserted: the tool mounts its own
          # pseudo-filesystems inside the target and what it leaves behind is
          # not something this file has verified.
          check system-profile nix/var/nix/profiles/system
          check system-link nix/var/nix/profiles/system-link
          check gcroot nix/var/nix/gcroots/current-system
          check static-etc etc/static
          check nixos-release etc/NIXOS
          check bin-sh sw/bin/sh

          for path in run/current-system run/booted-system; do
            if [ -e "$target/$path" ]; then
              echo "  --  $path present"
            else
              echo "  --  $path absent, as expected without a boot"
            fi
          done

          [ "$fail" -eq 0 ] || exit 1
          readlink -f "$target/nix/var/nix/profiles/system"

      - name: List what landed
        run: find /mnt/nixos/etc -maxdepth 2 | sort | head -40

      - name: Clean up the target
        if: always()
        run: sudo umount /mnt/nixos || true

      - uses: actions/upload-artifact@v7
        name: Upload the listing
        with:
          name: install-probe-listing
          path: |
            result/etc
            result/init
            result/sw
          if-no-files-found: error
          retention-days: 7