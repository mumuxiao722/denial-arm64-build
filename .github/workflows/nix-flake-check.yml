name: Nix Flake Check

on:
  workflow_dispatch:
    inputs:
      refresh_engine_hashes:
        description: Re-resolve the two AArch64 hashes in nix/flutter-engine-lock.json
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: true

# AArch64 only, and natively. The runner is the same architecture as the
# packages this repository exists to produce, so nothing here cross-compiles.
# The AArch64 engine has no binary cache -- denial.cachix.org carries only the
# x86_64 one -- so a full build compiles the engine from source and runs for
# hours. Evaluating and resolving fetches is the cheap half and is what most
# changes can be caught by.
jobs:
  check:
    name: Evaluate the flake on AArch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        name: Check out this repository

      - uses: cachix/install-nix-action@v31
        name: Install Nix
        with:
          # flake.nix declares these in nixConfig, but that is only applied to
          # a flake under --accept-flake-config, so the runner needs them
          # before the first evaluation happens.
          extra_nix_config: |
            extra-substituters = https://denial.cachix.org
            extra-trusted-public-keys = denial.cachix.org-1:wd8YTnvPmugFrtdMJWtR1XdVknR3/g2nmBJkT+vAruo=

      - name: Evaluate every output
        run: nix flake check --no-build --accept-flake-config --show-trace

  # One-time bootstrap, and needed again whenever the Dart or Flutter revision
  # upstream moves. Not part of the check: once the hashes in
  # nix/flutter-engine-lock.json are real the fetches succeed, and the engine
  # that follows them compiles from source for hours.
  engine-hashes:
    name: Resolve the AArch64 engine hashes
    if: inputs.refresh_engine_hashes
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        name: Check out this repository

      - uses: cachix/install-nix-action@v31
        name: Install Nix

      # Blanking the two keys puts the placeholders back, so both builds fail at
      # the fetch and Nix prints the real hash as `got:`. The fetch never
      # completes, so no compiler runs. Same trick as upstream's
      # tools/denial-nix refresh-engine-lock.
      - name: Blank the hashes and resolve them again
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, collections
          blank = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          p = pathlib.Path("nix/flutter-engine-lock.json")
          d = json.loads(p.read_text(), object_pairs_hook=collections.OrderedDict)
          d["dart"]["hash_aarch64"] = blank
          d["engine"]["source_hash_aarch64"] = blank
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY
          set +e
          # 40 lines rather than 4: hash resolution fails for a handful of
          # reasons and the one that matters is rarely the last line. The full
          # output used to go to an artifact, which meant the evidence was one
          # click away and a week from expiring; here it is just in the log.
          for attr in denial-flutter-dart denial-flutter-engine-source; do
            echo "=== $attr ==="
            nix build ".#$attr" --no-link 2>&1 | tail -40
          done
          for pair in \
            "dart.hash_aarch64:denial-flutter-dart" \
            "engine.source_hash_aarch64:denial-flutter-engine-source"; do
            key="${pair%%:*}"
            attr="${pair##*:}"
            got="$(nix build ".#$attr" --no-link 2>&1 \
              | sed -n 's/.*got: *//p' | head -1)"
            printf '%-28s %s\n' "$key" "${got:-<no got: line>}"
          done
