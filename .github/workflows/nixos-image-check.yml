name: NixOS Image Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-image-check-${{ github.ref }}
  cancel-in-progress: false

# Deliberately not a check. denial.cachix.org carries only the x86_64 engine, so
# an AArch64 build compiles the Flutter engine from source and runs for hours.
# Nothing here is automatic: it runs when someone wants to know whether the
# system still comes out of the store, not on every push.
#
# Named for the question it answers: can a real ARM64 NixOS machine install
# Denial, by way of nixos-install or nixos-switch. A minimal NixOS image is
# built around the package as the evidence, not as a product -- neither tool is
# run, because that needs a running NixOS to run it on and the ARM64 runner is
# Ubuntu.
#
# The output is not a deliverable. Nothing installs it, nobody ships it, and it
# is deliberately missing a bootloader and a display manager -- a display manager
# would try to start denial, and whether the compositor runs is upstream's
# business, since nothing here touches its source.
jobs:
  build:
    name: Build a minimal NixOS image and check that nixos-install or nixos-switch can install Denial
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        name: Check out this repository

      # No denial.cachix.org here on purpose. That cache carries upstream's
      # x86_64 engine and nothing else; a run on this runner substituted 1583
      # paths from cache.nixos.org and none from it. Registering it would cost a
      # trusted key and imply a cache that does not exist for this architecture.
      - uses: cachix/install-nix-action@v31
        name: Install Nix

      # One build, and the image is what gets built first. trial-rootfs pulls the
      # package in: the module puts it in environment.systemPackages and a
      # toplevel closes over systemPackages, so Nix has to build it either way.
      # The second command builds nothing -- the path is in the store by then --
      # it just writes the package symlink the checks below need, because inside
      # a toplevel /bin and /lib are symlinks into the store, not a merged tree.
      #
      # --print-build-logs streams every derivation's full log. Without it a
      # failure only reports its last 25 lines, which on a Rust build are
      # warnings and hide the errors above them.
      - name: Build image and package
        run: |
          nix build .#trial-rootfs -o result --accept-flake-config --show-trace \
            --print-build-logs --keep-failed
          nix build .#denial -o package

      - name: Verify build outputs
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ -e "$2" ]; then
              echo "  ok  $1"
            else
              echo "::error::$1 is missing from $3"
              fail=1
            fi
          }

          # Checked on the package rather than the system: inside a toplevel
          # /bin and /lib are symlinks into the store, not a merged tree.
          for path in \
            bin/deniald \
            bin/denialctl \
            bin/denial-portal \
            bin/denial-session \
            bin/denial-settings \
            lib/denial/flutter/lib/libflutter_engine.so \
            lib/denial/flutter/lib/libapp.so \
            lib/denial/flutter/data/icudtl.dat; do
            check "$path" "package/$path" package
          done

          # The module owns exactly one entry in the system /etc: the portal
          # config, which xdg.portal writes. The two .conf files are not there
          # and never were -- NixOS does not merge a package's $out/etc into the
          # system, and upstream's packaging/nixos/README.md documents them as
          # machine specific input a host may point at its own copies.
          check etc/xdg/xdg-desktop-portal-wlr/Denial \
            result/etc/xdg/xdg-desktop-portal-wlr/Denial system

          [ "$fail" -eq 0 ] || exit 1

          # Every existence check above would pass on a store path holding the
          # x86_64 engine. Its ELF header says otherwise, and nothing else in
          # this file catches it.
          file package/lib/denial/flutter/lib/libflutter_engine.so
          readelf -h package/lib/denial/flutter/lib/libflutter_engine.so \
            | grep 'AArch64'

      - name: List etc contents
        run: |
          find result/etc -maxdepth 3 | sort | head -40
          find package/etc -maxdepth 3 | sort | head -40

      - uses: actions/upload-artifact@v7
        name: Upload check artifacts
        with:
          name: install-check-listing
          path: |
            result/etc/xdg/xdg-desktop-portal-wlr/Denial
            package/etc/denial
            package/lib/denial/flutter/lib
          if-no-files-found: error
          retention-days: 7