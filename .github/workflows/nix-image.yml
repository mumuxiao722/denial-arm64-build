name: Nix Image Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-image-${{ github.ref }}
  cancel-in-progress: false

# Deliberately not a check. denial.cachix.org carries only the x86_64 engine, so
# an AArch64 build compiles the Flutter engine from source and runs for hours.
# Nothing here is automatic: it runs when someone wants to know whether the
# system still comes out of the store, not on every push.
#
# What it checks is what lands in the root filesystem, because that is what
# nixos-rebuild switch would be switching to. It does not boot anything and it
# does not start denial -- the compositor's runtime behaviour is upstream's, and
# this repository did not touch a line of its source.
jobs:
  build:
    name: Build the minimal root filesystem
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://denial.cachix.org
            extra-trusted-public-keys = denial.cachix.org-1:wd8YTnvPmugFrtdMJWtR1XdVknR3/g2nmBJkT+vAruo=

      - name: Build
        run: nix build .#trial-rootfs -o result --accept-flake-config --show-trace

      # The compositor, the engine and the plugin manager are what the module is
      # for. The paths are nix/package.nix:211-222, :280-285 and :340-341, and
      # the session entry is what a display manager reads to offer the session.
      - name: The compositor and its engine are in the tree
        run: |
          set -euo pipefail
          for path in \
            bin/deniald \
            bin/denialctl \
            bin/denial-portal \
            bin/denial-session \
            bin/denial-settings \
            etc/denial/session.conf \
            etc/denial/outputs.conf \
            etc/xdg/xdg-desktop-portal-wlr/Denial \
            lib/denial/flutter/lib/libflutter_engine.so \
            lib/denial/flutter/lib/libapp.so \
            lib/denial/flutter/data/icudtl.dat; do
            if [ ! -e "result/$path" ]; then
              echo "::error::$path is missing from the root filesystem"
              exit 1
            fi
            echo "  ok  $path"
          done

      - name: The engine matches the architecture it was built for
        run: |
          set -euo pipefail
          # A store path whose sha256 is the x86_64 engine would still pass the
          # existence checks above. Its ELF header says otherwise.
          file result/lib/denial/flutter/lib/libflutter_engine.so
          readelf -h result/lib/denial/flutter/lib/libflutter_engine.so \
            | grep --quiet 'AArch64'

      - name: List what was installed
        run: |
          find result -maxdepth 2 -mindepth 1 \
            \( -path 'result/nix' -o -path 'result/nix/*' \) -prune -o -print \
            | sort | head -60

      - uses: actions/upload-artifact@v7
        with:
          name: trial-rootfs-listing
          path: |
            result/etc/denial
            result/lib/denial/flutter/lib
          if-no-files-found: error
          retention-days: 7