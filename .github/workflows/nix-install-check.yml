name: Nix Install Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-install-check-${{ github.ref }}
  cancel-in-progress: false

# Deliberately not a check. denial.cachix.org carries only the x86_64 engine, so
# an AArch64 build compiles the Flutter engine from source and runs for hours.
# Nothing here is automatic: it runs when someone wants to know whether a real
# machine can install this, not on every push.
#
# nixos-install is run for real, against a tmpfs directory on this runner, rather
# than simulated. It copies the closure in and writes the target's system
# profile, which is what this checks afterwards.
#
# The activation is not reached. nixos-install runs switch-to-configuration in a
# mount namespace and what that leaves behind is not something this file has
# verified: /etc comes out holding /etc/NIXOS and nothing else, with no
# /etc/static, no /etc/systemd and no gcroot. So nothing under /etc is
# asserted here, and the system profile and /etc/NIXOS are, because those two
# are written by the install itself.
#
# Nothing boots either. The runner is Ubuntu, and the system has no bootloader.
#
# The target is not a deliverable. Nothing ships it, nobody uses it, and it is
# deliberately missing a display manager -- one would try to start denial, and
# whether the compositor runs is upstream's business, since nothing here touches
# its source.
jobs:
  build:
    name: Install a system to test whether Denial can be installed
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        name: Check out this repository

      # Not denial.cachix.org: that cache carries upstream's x86_64 engine and
      # nothing else, and a run on this runner substituted 1583 paths from
      # cache.nixos.org and none from it.
      #
      # denial-arm64.cachix.org is this repository's own, and holds what the
      # x86_64 cache cannot: the AArch64 engine. It is empty until a build here
      # pushes to it, and from the second run on this one costs minutes instead
      # of the hour the engine takes to compile from source.
      - uses: cachix/install-nix-action@v31
        name: Install Nix
        with:
          extra_nix_config: |
            extra-substituters = https://denial-arm64.cachix.org
            extra-trusted-public-keys = denial-arm64.cachix.org-1:FMxOqIH4Q1UX/sxmZxspx73o68MLKSd48ajvBjYIA0A=

      # One build. The system closure is what nixos-install installs, and it
      # pulls the package in: the module puts it in environment.systemPackages
      # and a toplevel closes over systemPackages, so Nix has to build it either
      # way. The second command builds nothing -- the path is in the store by
      # then -- it just writes the package symlink the checks need, because
      # inside a toplevel /bin and /lib are symlinks into the store, not a
      # merged tree.
      #
      # --print-build-logs streams every derivation's full log. Without it a
      # failure only reports its last 25 lines, which on a Rust build are
      # warnings and hide the errors above them.
      - name: Build the system to install
        id: build
        run: |
          nix build .#trial-rootfs -o result --accept-flake-config --show-trace \
            --print-build-logs
          nix build .#denial -o package
          echo "package=$(readlink -f package)" >> "$GITHUB_OUTPUT"

      # nixos-install has to mount /proc, /dev and /run inside the target before
      # it can chroot, so the target has to be a mount point. tmpfs rather than a
      # loop-mounted ext4 image: the closure is large, and the filesystem under
      # the target is not the thing under test here -- the activation is.
      # The package's runtime closure, which includes the engine: denial links
      # libflutter_engine.so out of it, so pushing this one path carries the
      # ninety minutes with it. Before the checks rather than after, so that a
      # run which fails one of them still leaves the cache populated.
      - name: Push the package closure to the cache
        uses: cachix/cachix-action@v16
        with:
          name: denial-arm64
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ${{ steps.build.outputs.package }}

      - name: Install into a target directory
        run: |
          set -euo pipefail
          target=/mnt/nixos
          sudo mkdir -p "$target"
          sudo mount -t tmpfs -o size=12G tmpfs "$target"

          # nixos-install calls nixos-enter, which is only in the system profile, and
          # runs nix-env, which the runner has on PATH through its Nix profile.
          # Neither survives the sudo below: sudoers sets secure_path to six
          # system directories, so everything exported here would be discarded.
          # Passing PATH through env is what delivers it. Three runs failed here
          # for this one reason, each time read as something else.
          sudo env PATH="$PATH:$PWD/result/sw/bin" \
            result/sw/bin/nixos-install \
            --root "$target" \
            --system "$(readlink -f result)" \
            --no-root-passwd --no-channel-copy --no-bootloader

      - name: Verify build outputs
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ -e "$2" ]; then
              echo "  ok  $1"
            else
              echo "::error::$1 is missing from $3"
              fail=1
            fi
          }

          # Checked on the package rather than the system: inside a toplevel
          # /bin and /lib are symlinks into the store, not a merged tree.
          for path in \
            bin/deniald \
            bin/denialctl \
            bin/denial-portal \
            bin/denial-session \
            bin/denial-settings \
            lib/denial/flutter/lib/libflutter_engine.so \
            lib/denial/flutter/lib/libapp.so \
            lib/denial/flutter/data/icudtl.dat; do
            check "$path" "package/$path" package
          done

          # The module owns exactly one entry in the system /etc. nixpkgs writes
          # xdg.portal.config.<name> to
          # /etc/xdg/xdg-desktop-portal/<name>-portals.conf, which is also how
          # it learns that denial in extraPortals is a portal at all.
          #
          # Not the file the package installs. package.nix puts its
          # xdg-desktop-portal-wlr/Denial in $out/etc, and NixOS does not merge
          # a package's $out/etc into the system, so that copy is never read on
          # NixOS -- the module expresses the same chooser through
          # xdg.portal.wlr.settings, which the portal takes as --config= rather
          # than from /etc. The two .conf files are in the same position, and
          # upstream's packaging/nixos/README.md gives them as machine specific
          # input a host may point at its own copies.
          check etc/xdg/xdg-desktop-portal/denial-portals.conf \
            result/etc/xdg/xdg-desktop-portal/denial-portals.conf system

          [ "$fail" -eq 0 ] || exit 1

          # Existence only says a file appeared. checks.module asserts the values
          # in it; that nixpkgs read xdg.portal.config.denial at all, and wrote
          # the interface preference, is a separate thing only the build shows.
          # nixpkgs toINI turns xdg.portal.config into a [preferred] section
          # rather than a preferred= line, so that is the section to look for.
          # Asserting denial winning Settings is the part that matters.
          f=result/etc/xdg/xdg-desktop-portal/denial-portals.conf
          if grep -q '^\[preferred\]' "$f" &&
             grep -q 'org\.freedesktop\.impl\.portal\.Settings.*denial' "$f"; then
            echo "  ok  denial-portals.conf prefers denial for the Settings interface"
          else
            echo "::error::denial-portals.conf does not prefer denial for Settings"
            cat "$f"
            exit 1
          fi

          # Every existence check above would pass on a store path holding the
          # x86_64 engine. Its ELF header says otherwise, and an ELF header is
          # all it says: a shared object that cannot be resolved is just as
          # AArch64 as one that can. So the header is checked, and then the
          # files are asked to resolve the libraries they ask for.
          #
          # The runner is aarch64, so ldd resolves them the way the loader
          # would, RPATH included. denial-session is left out on purpose:
          # package.nix builds it with wrapProgram, so it is a shell script and
          # has no libraries to resolve.
          readelf -h package/lib/denial/flutter/lib/libflutter_engine.so \
            | grep 'AArch64'

          # Matched with case rather than grepped through a pipe. grep -q exits
          # at the first match, the writer on the other end takes SIGPIPE, and
          # pipefail turns that signal into the pipeline's status -- which is
          # how run 38614016680 reported a package as absent from a closure it
          # was printed in. Nothing here depends on how much is piped.
          load_fail=0
          loads() {
            libs=$(ldd "$1" 2>&1 || true)
            case "$libs" in
              *'=> not found'*)
                echo "::error::$1 has unresolved shared libraries"
                printf '%s\n' "$libs" | grep '=> not found' | head -5 || true
                load_fail=1
                ;;
              *'not a dynamic executable'*)
                echo "::error::$1 is not a loadable ELF"
                load_fail=1
                ;;
              *)
                echo "  ok  $1 resolves every shared library it asks for"
                ;;
            esac
          }

          loads package/bin/deniald
          loads package/bin/denialctl
          loads package/bin/denial-portal
          loads package/lib/denial/flutter/lib/libflutter_engine.so

          [ "$load_fail" -eq 0 ] || exit 1

      # This is the half only a real install can show. /run/current-system is
      # created by switch-to-configuration, which nixos-install ran in the
      # chroot above; the profile and the gcroot beside it come from the same
      # activation. A closure that merely built would have none of them.
      - name: Verify what the install reached
        run: |
          set -euo pipefail
          fail=0
          target=/mnt/nixos

          check() {
            if [ -e "$target/$2" ]; then
              echo "  ok  $2"
            else
              echo "::error::$2 is missing from the installed system"
              fail=1
            fi
          }

          # What nixos-install produces is the system profile and /etc/NIXOS.
          #
          # /run/current-system/sw is where environment.systemPackages ends up,
          # and that symlink only exists once switch-to-configuration has run on
          # a booted system, so an install target cannot be asked for it. The
          # closure the profile points at can be: that is what a booted system
          # would go on to link into /run/current-system/sw. Option values
          # themselves are asserted by checks.module without paying for a build.
          check system-profile nix/var/nix/profiles/system
          check nixos-release etc/NIXOS

          system_path=$(readlink -f "$target/nix/var/nix/profiles/system")
          closure=$(nix path-info -r "$system_path")

          # The denial package this job built, asked about by its exact store
          # path. package, not result: result is the trial-rootfs, which is the
          # system profile itself and is therefore in its own closure, so
          # checking it would pass whatever the module did.
          #
          # Comparing paths rather than grepping is what makes this immune to
          # naming: the engine is denial-flutter-engine-raw-<version>, and
          # deniald is a file inside denial-native-app, not the name of any path.
          #
          # Together with step 7, which checks those files in package/ and asks
          # them to resolve their libraries, this says the installed system has
          # the binaries -- without walking 1600 paths to rediscover what the
          # store path already implies.
          package_path=$(readlink -f package)
          if printf '%s\n' "$closure" | grep -xF "$package_path" >/dev/null; then
            echo "  ok  the installed system contains $(basename "$package_path")"
          else
            echo "::error::$package_path is not in the installed system closure"
            printf '%s\n' "$closure" | grep -i denial | head -20 || true
            fail=1
          fi

          [ "$fail" -eq 0 ] || exit 1

          echo "--- what landed ---"
          find "$target/etc" -maxdepth 2 | sort | head -40

      - name: List etc contents
        run: |
          find result/etc -maxdepth 3 | sort | head -40
          find package/etc -maxdepth 3 | sort | head -40

      - name: Clean up the target
        if: always()
        run: sudo umount /mnt/nixos || true

      - uses: actions/upload-artifact@v7
        name: Upload check artifacts
        with:
          name: install-check-listing
          path: |
            result/etc/xdg/xdg-desktop-portal/denial-portals.conf
            package/etc/denial
            package/lib/denial/flutter/lib
          if-no-files-found: error
          retention-days: 7