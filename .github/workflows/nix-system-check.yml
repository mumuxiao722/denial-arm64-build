name: NixOS Switch Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-switch-check-${{ github.ref }}
  cancel-in-progress: false

# Deliberately not a check. denial.cachix.org carries only the x86_64 engine, so
# an AArch64 build compiles the Flutter engine from source and runs for hours.
# Nothing here is automatic: it runs when someone wants to know whether the
# system still comes out of the store, not on every push.
#
# Named for the question it answers: can a real ARM64 NixOS machine install
# Denial, by way of nixos-install or nixos-switch. A minimal NixOS image is
# built around the package as the evidence, not as a product -- neither tool is
# run, because that needs a running NixOS to run it on and the ARM64 runner is
# Ubuntu.
#
# The output is not a deliverable. Nothing installs it, nobody ships it, and it
# is deliberately missing a bootloader and a display manager -- a display manager
# would try to start denial, and whether the compositor runs is upstream's
# business, since nothing here touches its source.
jobs:
  build:
    name: Build a minimal NixOS image and check that nixos-install or nixos-switch can install Denial
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        name: Check out this repository

      - uses: cachix/install-nix-action@v31
        name: Install Nix
        with:
          extra_nix_config: |
            extra-substituters = https://denial.cachix.org
            extra-trusted-public-keys = denial.cachix.org-1:wd8YTnvPmugFrtdMJWtR1XdVknR3/g2nmBJkT+vAruo=

      - name: Build the Denial package
        run: |
          # --print-build-logs streams every derivation's full log. Without it a
          # failure only reports its last 25 lines, which on a Rust build are
          # warnings and hide the errors above them.
          nix build .#denial -o package --accept-flake-config --show-trace \
            --print-build-logs --keep-failed

      - name: Build the minimal NixOS image around it
        run: nix build .#trial-rootfs -o result --accept-flake-config --show-trace

      # The compositor, its engine and the session entry are what the module is
      # for. Checked on the package rather than the system because inside a
      # toplevel /bin and /lib are symlinks into the store, not a merged tree.
      - name: Check the compositor, its engine and its applications
        run: |
          set -euo pipefail
          for path in \
            bin/deniald \
            bin/denialctl \
            bin/denial-portal \
            bin/denial-session \
            bin/denial-settings \
            lib/denial/flutter/lib/libflutter_engine.so \
            lib/denial/flutter/lib/libapp.so \
            lib/denial/flutter/data/icudtl.dat; do
            if [ ! -e "package/$path" ]; then
              echo "::error::$path is missing from the package"
              exit 1
            fi
            echo "  ok  $path"
          done

      - name: Check that the engine is an AArch64 binary
        run: |
          set -euo pipefail
          # A store path holding the x86_64 engine would pass every existence
          # check above. Its ELF header says otherwise.
          file package/lib/denial/flutter/lib/libflutter_engine.so
          readelf -h package/lib/denial/flutter/lib/libflutter_engine.so \
            | grep --quiet 'AArch64'

      # The module owns exactly one entry in the system /etc: the portal
      # config, which xdg.portal writes. The two .conf files are not there and
      # never were -- NixOS does not merge a package's $out/etc into the system,
      # and upstream's packaging/nixos/README.md documents them as machine
      # specific input a host may point at its own copies. They are shipped in
      # the package as the packaged defaults.
      - name: Check the portal config the module wrote
        run: |
          set -euo pipefail
          path=etc/xdg/xdg-desktop-portal-wlr/Denial
          if [ ! -e "result/$path" ]; then
            echo "::error::$path is missing from the system"
            exit 1
          fi
          echo "  ok  $path"

      - name: Check the configuration files the package ships
        run: |
          set -euo pipefail
          for path in \
            etc/denial/session.conf \
            etc/denial/outputs.conf; do
            if [ ! -e "package/$path" ]; then
              echo "::error::$path is missing from the package"
              exit 1
            fi
            echo "  ok  $path"
          done

      - name: List what landed in /etc
        run: |
          find result/etc -maxdepth 3 | sort | head -40

      - uses: actions/upload-artifact@v7
        name: Upload the files that were checked
        with:
          name: install-check-listing
          path: |
            result/etc/xdg/xdg-desktop-portal-wlr/Denial
            package/etc/denial
            package/lib/denial/flutter/lib
          if-no-files-found: error
          retention-days: 7